name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  converter-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every Python version, not just the first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # 3.9 is gone from ubuntu-latest; code needs >=3.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install pytest pandas
      - run: PYTHONPATH=src python -m pytest -q tests/test_converter.py
